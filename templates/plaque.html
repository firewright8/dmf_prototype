<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Plaque - {{ base_id }}</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 40px; background: white; }
        .plaque-container { border: 5px solid #000; padding: 40px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 28px; margin-bottom: 5px; text-transform: uppercase; }
        h3 { font-size: 18px; color: #444; margin-bottom: 40px; font-weight: normal; }
        img.qr { width: 300px; height: 300px; margin-bottom: 20px; }
        .base-id { font-size: 24px; font-weight: bold; font-family: monospace; background: #f0f0f0; padding: 10px; border-radius: 5px; }
        .instruction { margin-top: 30px; font-size: 16px; font-weight: bold; }
        /* Hide buttons when printing */
        @media print { .no-print { display: none; } .plaque-container { border: none; } }
    </style>
</head>
<body>
    <div class="no-print" style="margin-bottom: 20px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px;">Print Plaque</button>
    </div>

    <div class="plaque-container">
        <h1>DMF Social Audit</h1>
        <h3>District Administration, Raigarh</h3>
        
        <img src="{{ qr_url }}" alt="QR Code" class="qr">
        
        <div class="base-id">{{ base_id }}</div>
        
        <div class="instruction">Scan this code to view official project documents and verify work execution.</div>
    </div>
</body>
</html>
